<section class="help-choosing">
	<div class="help-choosing__container">
		<div class="help-choosing__body">
			<h2 class="help-choosing__title title">Нужна помощь с выбором программы?</h2>
			<div class="help-choosing__descr">Напишите нам — подскажем вариант обучения и документы на выходе.</div>
			<div class="help-choosing__row">
				<ul class="help-choosing__tags">
					<li class="help-choosing__tag">Рабочие профессии</li>
					<li class="help-choosing__tag">Корпоративное обучение</li>
					<li class="help-choosing__tag">Проф. подготовка</li>
					<li class="help-choosing__tag">Повышение квалификации</li>
				</ul>
				<div class="help-contacts">
					<div class="help-contacts__cap">Где удобнее ответить</div>
					<ul class="help-contacts__items">
						<li class="help-contacts__item">
							<a href="">
								<img src="@img/icons/contacts/phone.svg" width="31" height="31" loading="lazy" alt="">
							</a>
						</li>
						<li class="help-contacts__item">
							<a href="">
								<img src="@img/icons/contacts/mail.svg" width="31" height="31" loading="lazy" alt="">
							</a>
						</li>
						<li class="help-contacts__item">
							<a href="">
								<img src="@img/icons/contacts/vk.svg" width="29" height="29" loading="lazy" alt="">
							</a>
						</li>
						<li class="help-contacts__item">
							<a href="">
								<img src="@img/icons/contacts/tg.svg" width="35" height="35" loading="lazy" alt="">
							</a>
						</li>
						<li class="help-contacts__item">
							<a href="">
								<img src="@img/icons/contacts/whats.svg" width="35" height="35" loading="lazy" alt="">
							</a>
						</li>
						<li class="help-contacts__item">
							<a href="">
								<img src="@img/icons/contacts/signal.svg" width="31" height="31" loading="lazy" alt="">
							</a>
						</li>
					</ul>
				</div>
			</div>
			<form class="help-form" action="#">
				<div class="help-form__inputs">
					<label class="input-line">
						<span class="input-line__descr">Имя</span>
						<input class="why-we-form__input input" type="text" name="form[]" placeholder="Ваше имя">
					</label>
					<label class="input-line">
						<span class="input-line__descr">Телефон</span>
						<input class="why-we-form__input input phone" type="tel" name="form[]" placeholder="+7 (___) ___-__-__">
					</label>
				</div>
				<div class="help-form__right">
					<button class="help-form__btn btn">Продолжить</button>
					<label class="checkbox">
						<input class="checkbox__input" type="checkbox" value="1" name="form[]">
						<span class="checkbox__text">Я согласен на <a href="">обработку персональных данных</a></span>
					</label>
				</div>
			</form>
		</div>
	</div>
</section>
