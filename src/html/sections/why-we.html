<section class="why-we">
	<div class="why-we__container">
		<div class="why-we__body">
			<div class="why-we__left">
				<h2 class="why-we__title title">Почему выбирают нас</h2>
				<ul class="why-we__cols">
					<li class="why-we-col">
						<div class="why-we-col__icon">
							<img srcset="@img/why-we/1@2x.png 2x" src="@img/why-we/1.png" width="80" height="80" loading="lazy" alt="">
						</div>
						<div class="why-we-col__descr">Официальные документы</div>
					</li>
					<li class="why-we-col">
						<div class="why-we-col__icon">
							<img srcset="@img/why-we/2@2x.png 2x" src="@img/why-we/2.png" width="80" height="80" loading="lazy" alt="">
						</div>
						<div class="why-we-col__descr">Понятные сроки</div>
					</li>
					<li class="why-we-col">
						<div class="why-we-col__icon">
							<img srcset="@img/why-we/3@2x.png 2x" src="@img/why-we/3.png" width="80" height="80" loading="lazy" alt="">
						</div>
						<div class="why-we-col__descr">Поддержка куратора</div>
					</li>
				</ul>
			</div>
			<form class="why-we-form" action="#">
				<div class="why-we-form__inputs">
					<label class="input-line input-line_col-2">
						<span class="input-line__descr">Имя</span>
						<input class="why-we-form__input input" type="text" name="form[]" placeholder="Ваше имя">
					</label>
					<label class="input-line input-line_col-2">
						<span class="input-line__descr">Телефон</span>
						<input class="why-we-form__input input phone" type="tel" name="form[]" placeholder="+7 (___) ___-__-__">
					</label>
					<label class="input-line">
						<span class="input-line__descr">Комментарий</span>
						<input class="why-we-form__input input" type="text" name="form[]" placeholder="Например: нужна профессия \ разряд \ сроки">
					</label>
				</div>
				<button class="why-we-form__btn btn">Продолжить</button>
			</form>
		</div>
	</div>
</section>
